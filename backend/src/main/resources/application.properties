server.port=8080
spring.application.name=buildo-backend

# Persistent Database: File-backed storage with AUTO_SERVER mode (persists across reboots)
spring.datasource.url=jdbc:h2:file:./data/buildodb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jackson.serialization.fail-on-empty-beans=false

# --- Production PostgreSQL Profile (Uncomment when deploying to Postgres) ---
# spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:buildodb}
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=${DB_USER:postgres}
# spring.datasource.password=${DB_PASSWORD:postgres}
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Security Configuration
buildo.jwt.secret=${BUILDO_JWT_SECRET}
buildo.jwt.expiration-ms=86400000

# Razorpay credentials are supplied through environment variables.
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
# Project demo defaults to ₹1 through a Razorpay test key, then requests a full refund.
# Set RAZORPAY_VERIFICATION_MODE=false only when intentionally enabling full-order checkout.
razorpay.verification-mode=${RAZORPAY_VERIFICATION_MODE:true}

# CORS
buildo.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080

# SMTP email configuration for account verification.
# Use a Gmail App Password (not your normal Google account password).
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.from=${SPRING_MAIL_FROM:${SPRING_MAIL_USERNAME:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Development-only option: when true, skip email and return the OTP in the API response.
# Keep false for real email verification.
buildo.otp.development-fallback=${BUILDO_OTP_DEVELOPMENT_FALLBACK:false}
